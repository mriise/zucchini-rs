[package]
name = "zucchini"
description = "Safe bindings to Chromium's Zucchini binary diff for executables"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# Link the prebuilt, attested static library instead of compiling Chromium sources.
prebuilt = ["zucchini-sys/prebuilt"]

[dependencies]
zucchini-sys = { path = "../zucchini-sys" }
