[package]
name = "zucchini"
description = "Safe bindings to Chromium's Zucchini binary diff for executables"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
# Link the prebuilt, attested static library instead of compiling Chromium sources.
prebuilt = ["zucchini-sys/prebuilt"]
# Patches to Zucchini's sources, off by default; see zucchini-sys's features and the crate docs.
vector-containers = ["zucchini-sys/vector-containers"]
radix-sort = ["zucchini-sys/radix-sort"]
# set_crc32, which chooses the whole-file CRC-32 implementation.
crc32-hook = ["zucchini-sys/crc32-hook"]
# Chromium base/zlib CRC with runtime-selected SIMD; no callback or extra crate dependency.
crc-fast = ["zucchini-sys/crc-fast"]

[dependencies]
zucchini-sys = { workspace = true }
