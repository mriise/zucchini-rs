name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, target: x86_64-pc-windows-msvc, cxx: clang-cl }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, cxx: clang++ }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, cxx: clang++ }
          - { os: macos-15, target: aarch64-apple-darwin, cxx: clang++ }
    defaults:
      run:
        shell: bash
    env:
      # Chromium's C++ is most of the build, so sccache keeps its objects in the Actions cache.
      # build.rs only lets cc apply a compiler wrapper when CXX is set.
      CXX: sccache ${{ matrix.cxx }}
      CC: sccache ${{ matrix.cxx == 'clang-cl' && 'clang-cl' || 'clang' }}
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the pinned Chromium files
        run: scripts/chromium.sh

      - name: Cache LLVM
        if: runner.os != 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/llvm
          key: llvm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-llvm.sh') }}

      - name: Install LLVM
        run: scripts/install-llvm.sh "$RUNNER_TEMP/llvm"

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Test
        env:
          ZUCCHINI_SYS_EXPORT_DIR: ${{ runner.temp }}/zucchini-default
        run: |
          cargo test --workspace --locked
          # New upstream changes must remain opt-in; retain only the existing build fix.
          grep -Fx 'patches libstdcxx-span.patch' "$ZUCCHINI_SYS_EXPORT_DIR/BUILD_INFO"

      # Native CRC without the separate callback feature.
      - name: Test with the optional patches
        run: cargo test --workspace --locked --features zucchini/radix-sort,zucchini/crc-fast

      - name: Test the optional CRC override with the native default
        run: cargo test -p zucchini --locked --features radix-sort,crc-fast,crc32-hook --test crc32 --test crc32_sys

      - name: Build the reproducible CRC benchmark
        run: cargo build --release --locked --manifest-path benchmarks/crc32/Cargo.toml --target-dir target/crc32-benchmark

      - name: Lint
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path benchmarks/crc32/Cargo.toml -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy --workspace --all-targets --locked --features zucchini/radix-sort,zucchini/crc-fast,zucchini/crc32-hook -- -D warnings
