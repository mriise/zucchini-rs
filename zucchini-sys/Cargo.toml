[package]
name = "zucchini-sys"
description = "Builds Chromium's Zucchini binary diff and exposes its C API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
rust-version.workspace = true
links = "zucchini"

[features]
# Link the static library this repository's prebuilt workflow built and attested, pinned by SHA-256
# in prebuilt.txt, instead of compiling Chromium sources with clang.
prebuilt = ["dep:ureq", "dep:sha2", "dep:flate2", "dep:tar"]

[build-dependencies]
cc = "1.4.6"
flate2 = { version = "1.1.10", optional = true }
sha2 = { version = "0.11.0", optional = true }
tar = { version = "0.4.46", optional = true }
ureq = { version = "3.4.2", optional = true }
